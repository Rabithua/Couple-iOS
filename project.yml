name: Couple
options:
  bundleIdPrefix: com.oursince
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: zh-Hans
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    DEVELOPMENT_TEAM: SSK4KVR5FN
targets:
  Couple:
    type: application
    platform: iOS
    sources:
      - path: Couple
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oursince.couple
        PRODUCT_NAME: Couple
        INFOPLIST_KEY_CFBundleDisplayName: 恋爱
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 选择照片来记录你们共同的时刻。
        INFOPLIST_KEY_NSFaceIDUsageDescription: 使用面容 ID 安全登录你们的情侣空间。
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: Config/Couple.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_STRICT_CONCURRENCY: complete
    dependencies: []
  CoupleTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: CoupleTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oursince.couple.tests
    dependencies:
      - target: Couple
  CoupleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: CoupleUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.oursince.couple.uitests
        TEST_TARGET_NAME: Couple
    dependencies:
      - target: Couple
schemes:
  Couple:
    build:
      targets:
        Couple: all
        CoupleTests: [test]
        CoupleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - name: CoupleTests
          parallelizable: true
        - name: CoupleUITests
          parallelizable: false
